rule_files:
  - ../rules/slo-burn.rules.yml

evaluation_interval: 15m

tests:
  # Healthy: ~99.2% of orders under threshold, inside the 0.99 target - never fires.
  - interval: 15m
    input_series:
      - series: 'orders_processing_seconds_bucket{le="0.5"}'
        values: "0+248x40"
      - series: 'orders_processing_seconds_count'
        values: "0+250x40"
    alert_rule_test:
      - eval_time: 7h
        alertname: OrdersSLOBurnRateHigh
        exp_alerts: []

  # Unhealthy: only 80% of orders under threshold, sustained across both windows - fires.
  - interval: 15m
    input_series:
      - series: 'orders_processing_seconds_bucket{le="0.5"}'
        values: "0+200x40"
      - series: 'orders_processing_seconds_count'
        values: "0+250x40"
    alert_rule_test:
      - eval_time: 7h
        alertname: OrdersSLOBurnRateHigh
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Orders SLO error budget is burning too fast"
              description: "Error budget burn rate exceeds 14.4x over 1h and 6x over 6h - at this rate the 30-day budget would be exhausted well before the window ends."
